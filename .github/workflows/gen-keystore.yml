name: Generate Release Keystore (one-time)

# One-time utility: generates a new persistent release keystore.
# Delete this workflow after use.

on:
  workflow_dispatch:

jobs:
  gen-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.TEMP_KS_PASS }}
          KEY_PASS: ${{ secrets.TEMP_KEY_PASS }}
        run: |
          keytool -genkeypair -v \
            -keystore remedoo-release.jks \
            -alias remedoo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Remedoo, OU=Mobile, O=Remedoo, L=Mumbai, ST=Maharashtra, C=IN"
          # Verify it opens with the password
          keytool -list -keystore remedoo-release.jks -storepass "$KS_PASS" -alias remedoo

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: remedoo-release.jks
