name: one-time-keystore-gen
# TEMPORARY: generates the persistent Remedoo release keystore once.
# Delete this file and the workflow run immediately after use.
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -genkeypair -v -keystore remedoo-release.jks \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Remedoo, OU=Mobile, O=Remedoo"
          base64 -w0 remedoo-release.jks > remedoo-release.jks.b64
          rm remedoo-release.jks
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: remedoo-keystore
          path: remedoo-release.jks.b64
