name: Deploy Supabase Functions

# Manual only: run from the Actions tab ("Run workflow") whenever a
# function under supabase/functions/ changes. Uses the repo secret
# SUPABASE_ACCESS_TOKEN (a project-scoped Supabase access token,
# created 2026-10-19 for CI deploys).
on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy payment-create
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy payment-create --project-ref zjlznbgcfzpcveqyjglf
